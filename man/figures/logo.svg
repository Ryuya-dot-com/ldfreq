<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 276" width="240" height="276" role="img" aria-label="ldfreq R package hex logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132F4C"/>
      <stop offset="100%" stop-color="#0A1929"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#56B4E9"/>
      <stop offset="100%" stop-color="#0072B2"/>
    </linearGradient>
  </defs>

  <!-- Outer Hexagon Border -->
  <polygon points="120,6 230,69.5 230,206.5 120,270 10,206.5 10,69.5"
           fill="url(#bgGrad)" stroke="#0072B2" stroke-width="8" stroke-linejoin="round"/>
  <!-- Subtle Inner Accent Rim -->
  <polygon points="120,16 221,74.5 221,201.5 120,260 19,201.5 19,74.5"
           fill="none" stroke="#56B4E9" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Subtle Horizontal Grid Rules -->
  <line x1="48" y1="84" x2="192" y2="84" stroke="#56B4E9" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="48" y1="118" x2="192" y2="118" stroke="#56B4E9" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="44" y1="152" x2="196" y2="152" stroke="#8AB4D8" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Vocabulary Frequency Bars (APA #0072B2 / #56B4E9) -->
  <rect x="54"  y="76"  width="18" height="76" rx="2.5" fill="url(#barGrad)" opacity="0.92"/>
  <rect x="82"  y="96"  width="18" height="56" rx="2.5" fill="url(#barGrad)" opacity="0.88"/>
  <rect x="110" y="111" width="18" height="41" rx="2.5" fill="url(#barGrad)" opacity="0.84"/>
  <rect x="138" y="123" width="18" height="29" rx="2.5" fill="url(#barGrad)" opacity="0.80"/>
  <rect x="166" y="133" width="18" height="19" rx="2.5" fill="url(#barGrad)" opacity="0.76"/>

  <!-- Lexical Diversity / Cumulative Coverage Trajectory (APA #D55E00) -->
  <path d="M 63 134 C 86 108, 112 90, 147 78 C 160 74, 169 71, 175 69"
        fill="none" stroke="#D55E00" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="63"  cy="134" r="4.5" fill="#FFFFFF" stroke="#D55E00" stroke-width="2.8"/>
  <circle cx="91"  cy="108" r="4.5" fill="#FFFFFF" stroke="#D55E00" stroke-width="2.8"/>
  <circle cx="119" cy="91"  r="4.5" fill="#FFFFFF" stroke="#D55E00" stroke-width="2.8"/>
  <circle cx="147" cy="78"  r="4.5" fill="#FFFFFF" stroke="#D55E00" stroke-width="2.8"/>
  <circle cx="175" cy="69"  r="4.5" fill="#FFFFFF" stroke="#D55E00" stroke-width="2.8"/>

  <!-- Package Wordmark -->
  <text x="120" y="202" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="800" letter-spacing="0.5" fill="#FFFFFF">ldfreq</text>
  <text x="120" y="224" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10.5" font-weight="600" letter-spacing="1.4" fill="#8AB4D8">LEXICAL DIVERSITY</text>
</svg>
