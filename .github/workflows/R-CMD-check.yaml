name: R-CMD-check

on:
  # Protected main requires the up-to-date PR checks before merging.
  # Test the merged result once; use dispatch for a deliberate environment recheck.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r-cmd-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation-scope:
    name: Verify source identity and reusable checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
      check-matrix: ${{ steps.reuse.outputs.check-matrix }}
      builder-matrix: ${{ steps.reuse.outputs.builder-matrix }}
      linux-reuse: ${{ steps.reuse.outputs.linux-reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 experiments/release-candidate/verify-reuse.py ci
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        if: steps.reuse.outputs.reuse == 'true' || steps.reuse.outputs.platform-reuse == 'true'
        with:
          r-version: "release"
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        if: steps.reuse.outputs.reuse == 'true' || steps.reuse.outputs.platform-reuse == 'true'
        with:
          packages: |
            any::digest
            any::jsonlite
            any::stringi
      - name: Recheck changed release controls
        if: steps.reuse.outputs.reuse == 'true' || steps.reuse.outputs.platform-reuse == 'true'
        run: |
          Rscript --vanilla development/audit-public-api.R .
          Rscript --vanilla experiments/release-candidate/validate-note-policy.R
          Rscript --vanilla experiments/release-candidate/validate-public-scan.R
          python3 experiments/release-candidate/validate-reuse.py
          Rscript --vanilla experiments/package-resource-inventory/check-resource-inventory.R .

  check:
    needs: validation-scope
    if: needs.validation-scope.outputs.reuse != 'true'
    name: ${{ matrix.config.os }} / R ${{ matrix.config.r }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.validation-scope.outputs.check-matrix) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: ${{ matrix.config.r == '4.1' && 'false' || 'true' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: Audit the documented public API surface
        if: ${{ matrix.config.os == 'ubuntu-24.04' && matrix.config.r == 'release' }}
        shell: bash
        run: |
          Rscript --vanilla development/audit-public-api.R .
          Rscript --vanilla experiments/release-candidate/validate-note-policy.R
          python3 experiments/validate-contextual-spans.py
          python3 experiments/validate-l2sca-runner.py

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          cache: always
          extra-packages: |
            any::rcmdcheck
            textstem=?ignore-before-r=4.4.0
            gibasa=?ignore-before-r=4.2.0
            ${{ matrix.config.r == '4.1' && 'Matrix@1.6-5 MASS@7.3-60 readxl@1.4.5 pbkrtest@0.5.2' || '' }}
          # Keep all ldfreq check dependencies; old Matrix Enhances are not used.
          dependencies: 'if (getRversion() < "4.2.0") c("Depends", "Imports", "LinkingTo", "Suggests") else "all"'
          needs: check

      - name: Explicitly obtain optional reference snapshots for integration checks
        shell: Rscript {0}
        run: |
          status <- system2(file.path(R.home("bin"), "Rscript"), c("--vanilla",
            "experiments/prepare-resources.R",
            shQuote(file.path(Sys.getenv("RUNNER_TEMP"), "ldfreq-resources")), "--accept-license"))
          if (!identical(status, 0L)) quit(status = status)

      - uses: r-lib/actions/check-r-package@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          args: 'c("--no-manual")'

      - name: Check resource inventory rejection cases
        if: ${{ matrix.config.os == 'ubuntu-24.04' && matrix.config.r == 'release' }}
        shell: Rscript {0}
        run: |
          status <- system2(file.path(R.home("bin"), "Rscript"), c("--vanilla",
            shQuote("experiments/package-resource-inventory/check-resource-inventory.R"), "."))
          if (!identical(status, 0L)) quit(status = status)

      - name: Audit source, platform, and installed resource inventories
        if: ${{ matrix.config.r == 'release' }}
        shell: Rscript {0}
        run: |
          audit_path <- file.path(
            Sys.getenv("RUNNER_TEMP"),
            "ldfreq-package-resource-inventory"
          )
          status <- system2(
            file.path(R.home("bin"), "Rscript"),
            args = c(
              "--vanilla",
              shQuote(file.path(
                "experiments", "package-resource-inventory",
                "validate-package-resource-inventory.R"
              )),
              shQuote(normalizePath(".", mustWork = TRUE)),
              shQuote(audit_path)
            )
          )
          if (!identical(status, 0L)) quit(status = status)
          evidence_path <- file.path(
            audit_path,
            "package-resource-inventory-evidence.json"
          )
          cat(readLines(evidence_path, warn = FALSE), sep = "\n")

      - name: Verify installed Japanese frequency example
        if: ${{ matrix.config.r == 'release' }}
        shell: Rscript {0}
        run: |
          source_path <- file.path(Sys.getenv("RUNNER_TEMP"), "tubelex-ja-base-pos.tsv.xz")
          download.file(paste0(
            "https://raw.githubusercontent.com/naist-nlp/tubelex/",
            "7cb5fb36add76b83a266d1967536e1a1d3faa513/",
            "frequencies/tubelex-ja-base-pos.tsv.xz"), source_path, mode = "wb")
          library_path <- file.path(Sys.getenv("RUNNER_TEMP"),
            "ldfreq-package-resource-inventory", "library")
          status <- system2(file.path(R.home("bin"), "Rscript"), c("--vanilla",
            shQuote("experiments/validate-japanese-tubelex.R"),
            shQuote(source_path), shQuote(library_path)))
          if (!identical(status, 0L)) quit(status = status)

      - name: Verify installed Japanese polysemy example
        if: ${{ matrix.config.r == 'release' }}
        shell: Rscript {0}
        run: |
          source_path <- file.path(Sys.getenv("RUNNER_TEMP"), "polysemous.txt")
          download.file(paste0(
            "https://raw.githubusercontent.com/masayu-a/WLSP-norms/",
            "72125c8dc538aeb70b07cb1c76c183e338f0cde9/polysemous.txt"),
            source_path, mode = "wb")
          library_path <- file.path(Sys.getenv("RUNNER_TEMP"),
            "ldfreq-package-resource-inventory", "library")
          status <- system2(file.path(R.home("bin"), "Rscript"), c("--vanilla",
            shQuote("experiments/validate-wlsp-polysemy.R"),
            shQuote(source_path), shQuote(library_path)))
          if (!identical(status, 0L)) quit(status = status)

  # A cold R-devel library took 21 minutes before checking started. Keep
  # that completed preparation in the standard cache, in its own time budget.
  prepare-r-devel:
    needs: validation-scope
    if: needs.validation-scope.outputs.reuse != 'true' && needs.validation-scope.outputs.linux-reuse != 'true'
    name: ubuntu-24.04 / prepare R devel dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "devel"
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          cache: always
          extra-packages: |
            any::rcmdcheck
            textstem=?ignore-before-r=4.4.0
            gibasa=?ignore-before-r=4.2.0
          dependencies: '"all"'
          needs: check

  check-r-devel:
    name: ubuntu-24.04 / R devel
    needs: [validation-scope, prepare-r-devel]
    if: needs.validation-scope.outputs.reuse != 'true' && needs.validation-scope.outputs.linux-reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "devel"
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          cache: always
          extra-packages: |
            any::rcmdcheck
            textstem=?ignore-before-r=4.4.0
            gibasa=?ignore-before-r=4.2.0
          dependencies: '"all"'
          needs: check
      - name: Explicitly obtain optional reference snapshots for integration checks
        shell: Rscript {0}
        run: |
          status <- system2(file.path(R.home("bin"), "Rscript"), c("--vanilla",
            "experiments/prepare-resources.R",
            shQuote(file.path(Sys.getenv("RUNNER_TEMP"), "ldfreq-resources")), "--accept-license"))
          if (!identical(status, 0L)) quit(status = status)

      - uses: r-lib/actions/check-r-package@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          args: 'c("--no-manual")'
          artifact-name: Linux-R-devel-results

  c-locale:
    needs: validation-scope
    if: needs.validation-scope.outputs.reuse != 'true' && needs.validation-scope.outputs.linux-reuse != 'true'
    name: ubuntu-24.04 / C locale
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "release"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          cache: always
          dependencies: 'c("Depends", "Imports", "LinkingTo", "Suggests")'
      - name: Explicitly obtain optional reference snapshots for integration checks
        shell: Rscript {0}
        run: |
          status <- system2(file.path(R.home("bin"), "Rscript"), c("--vanilla",
            "experiments/prepare-resources.R",
            shQuote(file.path(Sys.getenv("RUNNER_TEMP"), "ldfreq-resources")), "--accept-license"))
          if (!identical(status, 0L)) quit(status = status)

      - name: Install and test in a genuine C locale
        shell: bash
        env:
          LANG: C
          LC_ALL: C
        run: |
          R CMD INSTALL .
          Rscript --vanilla -e 'stopifnot(Sys.getlocale("LC_CTYPE") == "C"); library(ldfreq); stopifnot(tubelex_profile(c("the", "cat"))$status == "ok"); testthat::test_dir("tests/testthat", package = "ldfreq", stop_on_failure = TRUE)'

  tubelex-build-audit:
    needs: validation-scope
    if: needs.validation-scope.outputs.reuse != 'true' && needs.validation-scope.outputs.builder-matrix != '[]'
    name: ${{ matrix.os }} / TUBELEX builder
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.validation-scope.outputs.builder-matrix) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: |
            any::digest
            any::jsonlite
            any::stringi

      - name: Download the byte-pinned aggregate source
        shell: Rscript {0}
        run: |
          source_path <- file.path(
            Sys.getenv("RUNNER_TEMP"),
            "tubelex-en-treebank.tsv.xz"
          )
          download.file(
            paste0(
              "https://raw.githubusercontent.com/naist-nlp/tubelex/",
              "7cb5fb36add76b83a266d1967536e1a1d3faa513/",
              "frequencies/tubelex-en-treebank.tsv.xz"
            ),
            source_path,
            mode = "wb",
            quiet = TRUE
          )

      - name: Reproduce and stress the release unit
        shell: Rscript {0}
        run: |
          source_path <- file.path(
            Sys.getenv("RUNNER_TEMP"),
            "tubelex-en-treebank.tsv.xz"
          )
          audit_path <- file.path(Sys.getenv("RUNNER_TEMP"), "tubelex-audit")
          status <- system2(
            file.path(R.home("bin"), "Rscript"),
            args = c(
              "--vanilla",
              shQuote(file.path(
                "experiments", "tubelex-source-build",
                "validate-tubelex-release-unit.R"
              )),
              shQuote(source_path),
              shQuote(audit_path)
            )
          )
          if (!identical(status, 0L)) quit(status = status)

  pdf-manual:
    env:
      R_TEXI2DVICMD: emulation
    name: PDF reference manual
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: Install and expose the index tool
        run: |
          tlmgr update --self
          tlmgr install makeindex
          tlmgr path add
          command -v makeindex

      - name: Build and verify the PDF reference manual
        shell: bash
        run: Rscript --vanilla experiments/release-candidate/build-manual.R . "${RUNNER_TEMP}/ldfreq-manual.pdf"

  required:
    name: R-CMD-check required
    if: ${{ always() }}
    needs: [validation-scope, check, check-r-devel, c-locale, tubelex-build-audit, pdf-manual]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require verified scope and current manual
        env:
          SCOPE: ${{ needs.validation-scope.result }}
          MANUAL: ${{ needs.pdf-manual.result }}
        run: test "$SCOPE" = success && test "$MANUAL" = success
      - name: Record reused numeric checks
        if: needs.validation-scope.outputs.reuse == 'true'
        run: echo "Numeric CI is reused only after source, workflow and completed-run identity checks. Release controls and PDF manual were checked in this run."
      - name: Require every matrix check to pass
        if: needs.validation-scope.outputs.reuse != 'true'
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          DEVEL_RESULT: ${{ needs.check-r-devel.result }}
          C_LOCALE_RESULT: ${{ needs.c-locale.result }}
          TUBELEX_RESULT: ${{ needs.tubelex-build-audit.result }}
          PDF_MANUAL_RESULT: ${{ needs.pdf-manual.result }}
          LINUX_REUSE: ${{ needs.validation-scope.outputs.linux-reuse }}
        run: |
          if [ "${CHECK_RESULT}" != "success" ]; then
            echo "::error::R-CMD-check matrix result: ${CHECK_RESULT}"
            exit 1
          fi
          expected=success
          if [ "${LINUX_REUSE}" = "true" ]; then expected=skipped; fi
          if [ "${DEVEL_RESULT}" != "$expected" ] || [ "${C_LOCALE_RESULT}" != "$expected" ]; then
            echo "::error::R-devel: ${DEVEL_RESULT}; C locale: ${C_LOCALE_RESULT}"
            exit 1
          fi
          if [ "${TUBELEX_RESULT}" != "$expected" ]; then
            echo "::error::TUBELEX builder matrix result: ${TUBELEX_RESULT}"
            exit 1
          fi
          if [ "${PDF_MANUAL_RESULT}" != "success" ]; then
            echo "::error::PDF reference manual result: ${PDF_MANUAL_RESULT}"
            exit 1
          fi
