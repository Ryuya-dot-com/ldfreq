name: Release candidate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-state:
    name: Classify release-candidate state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_candidate: ${{ steps.metadata.outputs.is_candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Classify package metadata
        id: metadata
        shell: bash
        run: |
          version="$(sed -n 's/^Version:[[:space:]]*//p' DESCRIPTION)"
          status="$(sed -n 's/^Config\/ldfreq\/status:[[:space:]]*//p' DESCRIPTION)"
          if test "$version" = "0.1.0" && test "$status" = "release-candidate"; then
            echo "is_candidate=true" >> "$GITHUB_OUTPUT"
            echo "Exact 0.1.0 release-candidate metadata detected."
          else
            echo "is_candidate=false" >> "$GITHUB_OUTPUT"
            echo "Development metadata detected (Version: $version; status: $status)."
          fi

  build-source:
    name: Build exact source and evidence
    needs: candidate-state
    if: ${{ needs.candidate-state.outputs.is_candidate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          persist-credentials: false

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - uses: r-lib/actions/setup-tinytex@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: |
            any::digest
            any::jsonlite
          needs: check

      - name: Verify synchronized candidate metadata
        shell: Rscript {0}
        run: |
          description <- read.dcf("DESCRIPTION")
          version <- unname(description[[1L, "Version"]])
          stopifnot(identical(version, "0.1.0"))
          stopifnot(identical(
            unname(description[[1L, "Config/ldfreq/status"]]),
            "release-candidate"
          ))
          stopifnot(identical(readLines("NEWS.md", n = 1L), "# ldfreq 0.1.0"))
          citation <- paste(readLines(file.path("inst", "CITATION")), collapse = "\n")
          stopifnot(grepl('family = "Komuro"', citation, fixed = TRUE))
          stopifnot(grepl('R package version 0.1.0', citation, fixed = TRUE))

      - name: Build one source archive and the PDF manual
        shell: Rscript {0}
        run: |
          package_root <- normalizePath(".", mustWork = TRUE)
          output_root <- file.path(
            Sys.getenv("RUNNER_TEMP"),
            "release-candidate-source"
          )
          stopifnot(dir.create(output_root, recursive = TRUE))
          old <- setwd(output_root)
          on.exit(setwd(old), add = TRUE)
          build_status <- system2(
            file.path(R.home("bin"), "R"),
            c("CMD", "build", shQuote(package_root))
          )
          if (!identical(build_status, 0L)) quit(status = build_status)
          archive <- list.files(
            output_root,
            pattern = "^ldfreq_0[.]1[.]0[.]tar[.]gz$",
            full.names = TRUE
          )
          stopifnot(length(archive) == 1L)
          manual <- file.path(output_root, "ldfreq_0.1.0.pdf")
          manual_status <- system2(
            file.path(R.home("bin"), "R"),
            c(
              "CMD", "Rd2pdf", "--no-preview",
              paste0("--output=", shQuote(manual)),
              shQuote(package_root)
            )
          )
          if (!identical(manual_status, 0L)) quit(status = manual_status)

      - name: Generate BOM, SBOM, resource BOM, and provenance
        shell: Rscript {0}
        run: |
          output_root <- file.path(
            Sys.getenv("RUNNER_TEMP"),
            "release-candidate-source"
          )
          archive <- list.files(
            output_root,
            pattern = "^ldfreq_0[.]1[.]0[.]tar[.]gz$",
            full.names = TRUE
          )
          status <- system2(
            file.path(R.home("bin"), "Rscript"),
            c(
              "--vanilla",
              shQuote(file.path(
                "experiments", "release-candidate",
                "generate-release-evidence.R"
              )),
              shQuote(normalizePath(".", mustWork = TRUE)),
              shQuote(archive),
              shQuote(file.path(output_root, "ldfreq_0.1.0.pdf")),
              shQuote(file.path(output_root, "evidence"))
            )
          )
          if (!identical(status, 0L)) quit(status = status)

      - name: Upload exact source and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-source
          path: |
            ${{ runner.temp }}/release-candidate-source/ldfreq_0.1.0.tar.gz
            ${{ runner.temp }}/release-candidate-source/ldfreq_0.1.0.pdf
            ${{ runner.temp }}/release-candidate-source/evidence/*.json
          if-no-files-found: error
          retention-days: 30

  check-artifact:
    name: ${{ matrix.config.label }}
    needs: [candidate-state, build-source]
    if: ${{ needs.candidate-state.outputs.is_candidate == 'true' && needs.build-source.result == 'success' }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: "release", label: "ubuntu-latest-r-release"}
          - {os: ubuntu-latest, r: "devel", label: "ubuntu-latest-r-devel"}
          - {os: ubuntu-latest, r: "4.1", label: "ubuntu-latest-r-4.1"}
          - {os: macos-latest, r: "release", label: "macos-latest-r-release"}
          - {os: windows-latest, r: "release", label: "windows-latest-r-release"}
    env:
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: ${{ matrix.config.r == '4.1' && 'false' || 'true' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-source
          path: ${{ runner.temp }}/release-candidate-source

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: |
            any::digest
            any::jsonlite
            textstem=?ignore-before-r=4.4.0
          needs: check

      - name: Check the exact source archive as CRAN
        shell: Rscript {0}
        run: |
          candidate_root <- file.path(
            Sys.getenv("RUNNER_TEMP"),
            "release-candidate-source"
          )
          archive <- list.files(
            candidate_root,
            pattern = "^ldfreq_0[.]1[.]0[.]tar[.]gz$",
            full.names = TRUE
          )
          stopifnot(length(archive) == 1L)
          status <- system2(
            file.path(R.home("bin"), "Rscript"),
            c(
              "--vanilla",
              shQuote(file.path(
                "experiments", "release-candidate", "run-as-cran-check.R"
              )),
              shQuote(archive),
              shQuote(file.path(Sys.getenv("RUNNER_TEMP"), "as-cran-check")),
              shQuote("${{ matrix.config.label }}")
            )
          )
          if (!identical(status, 0L)) quit(status = status)

      - name: Audit exact source, platform, and installed resource inventories
        if: ${{ matrix.config.r == 'release' }}
        shell: Rscript {0}
        run: |
          candidate_root <- file.path(
            Sys.getenv("RUNNER_TEMP"),
            "release-candidate-source"
          )
          archive <- list.files(
            candidate_root,
            pattern = "^ldfreq_0[.]1[.]0[.]tar[.]gz$",
            full.names = TRUE
          )
          status <- system2(
            file.path(R.home("bin"), "Rscript"),
            c(
              "--vanilla",
              shQuote(file.path(
                "experiments", "package-resource-inventory",
                "validate-package-resource-inventory.R"
              )),
              shQuote(normalizePath(".", mustWork = TRUE)),
              shQuote(file.path(Sys.getenv("RUNNER_TEMP"), "resource-inventory")),
              shQuote(archive)
            )
          )
          if (!identical(status, 0L)) quit(status = status)

      - name: Upload platform check evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-check-${{ matrix.config.label }}
          path: |
            ${{ runner.temp }}/as-cran-check/check-result.json
            ${{ runner.temp }}/as-cran-check/command-output.log
            ${{ runner.temp }}/as-cran-check/*.Rcheck/00check.log
            ${{ runner.temp }}/resource-inventory/package-resource-inventory-evidence.json
          if-no-files-found: warn
          retention-days: 30

  required:
    name: Release-candidate required
    if: ${{ always() }}
    needs: [candidate-state, build-source, check-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Require successful candidate classification
        shell: bash
        env:
          CANDIDATE_STATE_RESULT: ${{ needs.candidate-state.result }}
        run: test "$CANDIDATE_STATE_RESULT" = "success"

      - name: Report development workflow scope
        if: ${{ needs.candidate-state.outputs.is_candidate != 'true' }}
        shell: bash
        run: echo "Release-candidate evidence is not applicable to development metadata."

      - name: Require successful source and matrix jobs
        if: ${{ needs.candidate-state.outputs.is_candidate == 'true' }}
        shell: bash
        env:
          BUILD_SOURCE_RESULT: ${{ needs.build-source.result }}
          CHECK_ARTIFACT_RESULT: ${{ needs.check-artifact.result }}
        run: |
          test "$BUILD_SOURCE_RESULT" = "success"
          test "$CHECK_ARTIFACT_RESULT" = "success"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.candidate-state.outputs.is_candidate == 'true' }}
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.candidate-state.outputs.is_candidate == 'true' }}
        with:
          name: release-candidate-source
          path: ${{ runner.temp }}/release-candidate-source

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.candidate-state.outputs.is_candidate == 'true' }}
        with:
          pattern: release-check-*
          path: ${{ runner.temp }}/release-check-evidence

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        if: ${{ needs.candidate-state.outputs.is_candidate == 'true' }}
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        if: ${{ needs.candidate-state.outputs.is_candidate == 'true' }}
        with:
          extra-packages: |
            any::digest
            any::jsonlite

      - name: Require one artifact and every matrix result
        if: ${{ needs.candidate-state.outputs.is_candidate == 'true' }}
        shell: Rscript {0}
        run: |
          status <- system2(
            file.path(R.home("bin"), "Rscript"),
            c(
              "--vanilla",
              shQuote(file.path(
                "experiments", "release-candidate", "assemble-run-index.R"
              )),
              shQuote(file.path(
                Sys.getenv("RUNNER_TEMP"), "release-candidate-source"
              )),
              shQuote(file.path(
                Sys.getenv("RUNNER_TEMP"), "release-check-evidence"
              )),
              shQuote(file.path(Sys.getenv("RUNNER_TEMP"), "release-run-index"))
            )
          )
          if (!identical(status, 0L)) quit(status = status)

      - name: Upload release-candidate run index
        if: ${{ needs.candidate-state.outputs.is_candidate == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-run-index
          path: ${{ runner.temp }}/release-run-index/release-candidate-run-index.json
          if-no-files-found: error
          retention-days: 30
