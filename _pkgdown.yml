url: https://ryuya-dot-com.github.io/ldfreq/

template:
  bootstrap: 5

home:
  title: Reproducible Lexical Diversity and Frequency Profiles in R
  description: >
    Compute lexical diversity, reference-vocabulary coverage, custom lexical
    norms, and source-linked corpus analyses while preserving counted words,
    settings, and missingness reasons.

